<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231F7A5C'/%3E%3Cpath d='M4 17 L10 10 L14 13 L20 6' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='6' r='1.9' fill='white'/%3E%3C/svg%3E">
<title>Essanz — Danke</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  :root{
    --bg:#EFF2F0; --surface:#FFFFFF; --ink:#10161F; --ink-soft:#4B5561; --ink-faint:#7C8690;
    --line:rgba(16,22,31,.13); --accent:#1F7A5C; --accent-ink:#FFFFFF;
    --shadow: 0 1px 2px rgba(16,22,31,.06), 0 12px 32px -16px rgba(16,22,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E141F; --surface:#161E2B; --ink:#ECEEEE; --ink-soft:#A7B0BC; --ink-faint:#77828F;
      --line:rgba(236,238,238,.12); --accent:#3FAE81; --accent-ink:#06140F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 40px -20px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased; padding:24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
    padding:44px 40px; max-width:440px; text-align:center;
  }
  .mark{ width:40px; height:40px; border-radius:10px; background:var(--accent); display:grid; place-items:center; margin:0 auto 20px; }
  .mark svg{ width:22px; height:22px; }
  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:1.5rem; margin:0 0 12px; }
  p{ color:var(--ink-soft); line-height:1.6; margin:0 0 26px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:9px;
    font-size:.92rem; font-weight:600; text-decoration:none; background:var(--accent); color:var(--accent-ink);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 17 L10 10 L14 13 L20 6" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="6" r="1.8" fill="white"/>
      </svg>
    </div>
    <h1>Danke für Ihr Interesse</h1>
    <p>Sie sind eingetragen. Sobald es bei Essanz weitergeht, melden wir uns direkt bei Ihnen.</p>
    <a class="btn" href="index.html">Zurück zur Startseite</a>
  </div>
</body>
</html>
